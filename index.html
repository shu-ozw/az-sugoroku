<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZすごろく</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .board-container {
            position: relative;
            width: 100%;
            max-width: 900px;
        }
        .board-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        /* ─── マスの共通スタイル（最初の赤枠・位置のまま） ─── */
        .mask-cell {
            position: absolute;
            background-color: rgba(255, 0, 0, 0.2);
            border: 2px dashed red;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .mask-cell:active {
            opacity: 0.8;
        }

        /* ─── 隠れているとき（もやがかかったすりガラス風 ＋ ？マーク） ─── */
        .mask-cell.hidden {
            background-color: rgba(240, 244, 248, 0.8);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .mask-cell.hidden::after {
            content: "？";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.8rem;
            color: #334155;
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
        }

        /* ─── 最初の赤枠の座標に戻した設定 ─── */
        /* 上部エリア */
        .cell-top-1  { top: 9.5%; left: 14%; width: 14%; height: 12.5%; }
        .cell-top-2  { top: 2.7%;  left: 28.3%; width: 14%; height: 12.5%; }
        .cell-top-3  { top: 2.7%;  left: 42.6%; width: 14%; height: 12.5%; }
        .cell-top-4  { top: 2.7%;  left: 57%; width: 14%; height: 12.5%; }
        .cell-top-5  { top: 9.5%; left: 71.6%; width: 14%; height: 12.5%; }

        /* 左右の縦エリア */
        .cell-left-1  { top: 22.2%; left: 6.7%; width: 14%; height: 12.5%; }
        .cell-left-2  { top: 35.4%; left: 6.7%; width: 14%; height: 12.5%; }
        .cell-left-3  { top: 48.5%; left: 6.7%; width: 14%; height: 12.5%; }
        .cell-left-4  { top: 62%; left: 6.7%; width: 14%; height: 12.5%; }

        .cell-right-1 { top: 22.2%; left: 79%; width: 14%; height: 12.5%; }
        .cell-right-2 { top: 35.4%; left: 79%; width: 14%; height: 12.5%; }
        .cell-right-3 { top: 48.5%; left: 79%; width: 14%; height: 12.5%; }
        .cell-right-4 { top: 62%; left: 79%; width: 14%; height: 12.5%; }

        /* 下部エリア */
        .cell-bottom-0 { top: 74.7%; left: 14%; width: 14%; height: 12.5%; }
        .cell-bottom-1 { top: 65.2%; left: 28.3%; width: 14%; height: 12.5%; }
        .cell-bottom-2 { top: 65.2%; left: 42.6%; width: 14%; height: 12.5%; }
        .cell-bottom-3 { top: 65%; left: 57%; width: 14%; height: 12.5%; }

        .cell-bottom-4 { top: 85%; left: 28.3%; width: 14%; height: 12.5%; }
        .cell-bottom-5 { top: 85%; left: 42.6%; width: 14%; height: 12.5%; }
        .cell-bottom-6 { top: 85%; left: 57%; width: 14%; height: 12.5%; }
        .cell-bottom-7 { top: 74.9%; left: 71.6%; width: 14%; height: 12.5%; }
    </style>
</head>
<body>

    <div class="board-container">
        <!-- 画像ファイル名（board.png） -->
        <img src="board.png" alt="AZすごろくボード">

        <!-- 各マスのタッチ判定エリア -->
        <div class="mask-cell cell-top-1" onclick="toggleMask(this)"></div>
        <div class="mask-cell cell-top-2" onclick="toggleMask(this)"></div>
        <div class="mask-cell cell-top-3" onclick="toggleMask(this)"></div>
        <div class="mask-cell cell-top-4" onclick="toggleMask(this)"></div>
        <div class="mask-cell cell-top-5" onclick="toggleMask(this)"></div>

        <div class="mask-cell cell-left-1" onclick="toggleMask(this)"></div>
        <div class="mask-cell cell-left-2" onclick="toggleMask(this)"></div>
        <div class="mask-cell cell-left-3" onclick="toggleMask(this)"></div>
        <div class="mask-cell cell-left-4" onclick="toggleMask(this)"></div>

        <div class="mask-cell cell-right-1" onclick="toggleMask(this)"></div>
        <div class="mask-cell cell-right-2" onclick="toggleMask(this)"></div>
        <div class="mask-cell cell-right-3" onclick="toggleMask(this)"></div>
        <div class="mask-cell cell-right-4" onclick="toggleMask(this)"></div>

        <div class="mask-cell cell-bottom-0" onclick="toggleMask(this)"></div>
        <div class="mask-cell cell-bottom-1" onclick="toggleMask(this)"></div>
        <div class="mask-cell cell-bottom-2" onclick="toggleMask(this)"></div>
        <div class="mask-cell cell-bottom-3" onclick="toggleMask(this)"></div>

        <div class="mask-cell cell-bottom-4" onclick="toggleMask(this)"></div>
        <div class="mask-cell cell-bottom-5" onclick="toggleMask(this)"></div>
        <div class="mask-cell cell-bottom-6" onclick="toggleMask(this)"></div>
        <div class="mask-cell cell-bottom-7" onclick="toggleMask(this)"></div>
    </div>

    <script>
        function toggleMask(element) {
            element.classList.toggle('hidden');
        }
    </script>
</body>
</html>
